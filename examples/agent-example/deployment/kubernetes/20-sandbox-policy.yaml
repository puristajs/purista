apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: purista-sandboxes
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "100"
    requests.storage: 500Gi
    count/pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-default-limits
  namespace: purista-sandboxes
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  namespace: purista-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

