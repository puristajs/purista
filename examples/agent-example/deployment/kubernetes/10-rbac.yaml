apiVersion: v1
kind: ServiceAccount
metadata:
  name: purista-agent-example
  namespace: purista-agent-example
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: purista-sandbox
  namespace: purista-sandboxes
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: purista-harness-sandbox-controller
  namespace: purista-sandboxes
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: purista-agent-example-controls-sandboxes
  namespace: purista-sandboxes
subjects:
  - kind: ServiceAccount
    name: purista-agent-example
    namespace: purista-agent-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: purista-harness-sandbox-controller

