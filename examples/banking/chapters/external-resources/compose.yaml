services:
  legacy-transaction-provider:
    image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    user: node
    working_dir: /app
    command: ["node", "/app/mockLegacyTransactionProvider.ts"]
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "4010"
    volumes:
      - ./src/resources/mockLegacyTransactionProvider.ts:/app/mockLegacyTransactionProvider.ts:ro
    ports:
      - "127.0.0.1:4010:4010"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
