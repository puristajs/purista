services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: example_bank
      POSTGRES_USER: example_bank
      POSTGRES_PASSWORD: local-example-password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - knowledge-postgres:/var/lib/postgresql/data
      - ./database/knowledge.sql:/docker-entrypoint-initdb.d/001-knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example_bank -d example_bank"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  knowledge-postgres:
