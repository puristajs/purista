services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_tutorial
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_tutorial"]
      interval: 3s
      timeout: 2s
      retries: 20
