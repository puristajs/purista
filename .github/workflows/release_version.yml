name: Release Prepare PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@purista'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release
        run: ./scripts/releasePrepare.sh ${{ inputs.version }}

      - name: Read new version
        id: version
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ -z "$VERSION" ]; then
            echo "Could not read package version."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit release changes to branch
        id: commit
        run: |
          RELEASE_BRANCH="release/v${{ steps.version.outputs.value }}"
          git config user.name "${{ vars.CI_COMMIT_AUTHOR || 'github-actions[bot]' }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "No release changes detected."
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.version.outputs.value }}"
          git push --force-with-lease origin "$RELEASE_BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          RELEASE_BRANCH="${{ steps.commit.outputs.branch }}"
          VERSION="${{ steps.version.outputs.value }}"
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/main...$RELEASE_BRANCH?expand=1"
          PR_NUMBER="$(gh pr list --head "$RELEASE_BRANCH" --base main --json number --jq '.[0].number' || true)"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            if ! gh pr edit "$PR_NUMBER" \
              --title "chore(release): v$VERSION" \
              --body "Automated release preparation PR for v$VERSION."; then
              echo "Failed to update release PR #$PR_NUMBER."
              exit 1
            fi
          else
            if ! gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): v$VERSION" \
              --body "Automated release preparation PR for v$VERSION."; then
              echo "::warning::Could not create release PR automatically. Open it manually: $COMPARE_URL"
            fi
          fi
          echo "Release branch is ready: $RELEASE_BRANCH"
          echo "If no PR was created automatically, open: $COMPARE_URL"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
