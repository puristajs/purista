name: Release And Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment: publish_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@purista'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release
        run: ./scripts/releasePrepare.sh ${{ inputs.version }}

      - name: Read new version
        id: version
        run: echo "value=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Commit release changes and tag
        run: |
          git config user.name "${{ vars.CI_COMMIT_AUTHOR || 'github-actions[bot]' }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.version.outputs.value }}"
          git tag -a "v${{ steps.version.outputs.value }}" -m "v${{ steps.version.outputs.value }}"
          git push origin HEAD
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Publish to npm
        run: npm publish --access public --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "v${{ steps.version.outputs.value }}" -F CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
