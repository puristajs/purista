name: Release Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    environment: publish_version
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release publish must run on main. Current ref: ${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@purista'

      - name: Install dependencies
        run: npm ci

      - name: Build publish artifacts
        run: |
          npm run build -w packages/core
          npm run build --workspaces --if-present

      - name: Read current version
        id: version
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ -z "$VERSION" ]; then
            echo "Could not read package version."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists on origin."
            exit 1
          fi

      - name: Publish to npm
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execSync } = require('node:child_process')

          const packagesDir = path.join(process.cwd(), 'packages')
          const packageDirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name))

          for (const dir of packageDirs) {
            const packageJsonPath = path.join(dir, 'package.json')
            if (!fs.existsSync(packageJsonPath)) continue

            const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'))
            if (!pkg.name || !pkg.version) continue
            if (pkg.private === true) continue

            const viewCmd = `npm view "${pkg.name}@${pkg.version}" version --registry=https://registry.npmjs.org --silent`
            try {
              const publishedVersion = execSync(viewCmd, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim()
              if (publishedVersion === pkg.version) {
                console.log(`Skipping ${pkg.name}@${pkg.version} (already published)`)
                continue
              }
            } catch {
              // npm view exits non-zero when the exact version does not exist yet.
            }

            console.log(`Publishing ${pkg.name}@${pkg.version}`)
            execSync('npm publish --provenance --access public', { cwd: dir, stdio: 'inherit' })
          }
          NODE

      - name: Create tag and push
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "${{ vars.CI_COMMIT_AUTHOR || 'github-actions[bot]' }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        run: gh release create "v${{ steps.version.outputs.value }}" -F CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
