name: Release Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    environment: publish_version
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs on master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Release publish must run on master. Current ref: ${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@purista'

      - name: Install dependencies
        run: npm ci

      - name: Build publish artifacts
        run: |
          npm run build -w packages/core
          npm run build --workspaces --if-present

      - name: Read current version
        id: version
        run: echo "value=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists on origin."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag and push
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "${{ vars.CI_COMMIT_AUTHOR || 'github-actions[bot]' }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        run: gh release create "v${{ steps.version.outputs.value }}" -F CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
